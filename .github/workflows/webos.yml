name: webOS receiver
on:
  push:
    branches: [main]
    paths: ["webos/**", ".github/workflows/webos.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Receiver and pairing tests
        run: npm test
      - name: Check the webOS 23 Node runtime
        run: npm exec --yes --package=node@12.22.12 -- node tests/node12-smoke.js
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser playback and layout tests
        run: npm run test:browser
      - name: Build LG installable package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Resona-webOS
          path: webos/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webOS-test-results
          path: webos/test-results/
  publish:
    name: Publish Homebrew repository
    needs: test-and-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Resona-webOS
          path: webos/dist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run assets
        working-directory: webos
      - name: Publish immutable IPK and refresh the JSON repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 webos/scripts/publish_homebrew.py
