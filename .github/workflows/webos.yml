name: webOS receiver
on:
  push:
    branches: [main]
    paths: ["webos/**", ".github/workflows/webos.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Receiver and pairing tests
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser playback and layout tests
        run: npm run test:browser
      - name: Build LG installable package
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Resona-webOS-0.1.0
          path: webos/dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webOS-test-results
          path: webos/test-results/
