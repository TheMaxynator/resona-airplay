name: AirPlay iOS

on:
  push:
    branches: [main, airplay-tv]
    paths: ["ios/**", "scripts/prepare_tv_test_host.py", ".github/workflows/airplay-ios.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: airplay-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and test iOS artwork display
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: airplay-konan-${{ runner.os }}-${{ hashFiles('ios/gradle/libs.versions.toml') }}
      - name: Typecheck native display code
        run: |
          xcodebuild -version
          xcrun swiftc -typecheck -target arm64-apple-ios16.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            ios/iosApp/iosApp/TVNowPlaying.swift ios/iosApp/iosApp/LGConnect.swift
      - name: Test native display and render the four layouts
        run: |
          set -o pipefail
          python3 scripts/prepare_tv_test_host.py "$RUNNER_TEMP/tv-test-host"
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project "$RUNNER_TEMP/tv-test-host/iosApp.xcodeproj" -scheme iosApp \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/tv-test-build" \
            -resultBundlePath "$RUNNER_TEMP/TVDisplayTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test | tee "$RUNNER_TEMP/airplay-tests.log"
          xcrun simctl shutdown "$DEVICE_ID"
      - name: Build unsigned IPA
        working-directory: ios/iosApp
        run: |
          set -o pipefail
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | tee "$RUNNER_TEMP/airplay-build.log"
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Debug-iphoneos/Resona.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../Resona-TV-2.0.4.ipa Payload
      - name: Upload unsigned test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Resona-TV-2.0.4-unsigned
          path: ios/iosApp/build/Resona-TV-2.0.4.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay-test-results
          path: |
            ${{ runner.temp }}/TVDisplayTests.xcresult
            ${{ runner.temp }}/airplay-build.log
            ${{ runner.temp }}/airplay-tests.log
          retention-days: 14
