<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="resona-display-token" content="RESONA_DISPLAY_TOKEN"><title>Resona TV</title><link rel="stylesheet" href="tv.css"></head>
<body data-layout="cinema">
  <div id="backdrop" aria-hidden="true"></div><div id="color-wash" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
  <main id="composition" aria-label="Huidig nummer">
    <div class="cover-wrap"><img id="cover" alt="" hidden><div id="placeholder" aria-label="Geen albumhoes">♪</div></div>
    <section class="details"><div class="brand">RESONA</div><div class="title-line"><span id="playing-indicator" aria-hidden="true"><i></i><i></i><i></i><i></i></span><h1 id="title">Je muziek. Op groot scherm.</h1></div><p id="artist">Koppel je iPhone om een nummer te kiezen.</p><div id="progress-area" hidden><div class="progress-track"><div id="progress-fill"></div></div><div id="waveform-track" aria-hidden="true" hidden><canvas class="waveform-base"></canvas><div class="waveform-clip"><canvas class="waveform-played"></canvas></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></div></section>
  </main>
  <section id="pairing" class="pairing" aria-label="Koppel je iPhone"><div><div class="eyebrow">KOPPEL JE IPHONE</div><h2>Open dit adres op je telefoon</h2><p id="remote-url" class="remote-url">Verbinding wordt voorbereid…</p><p class="pair-help">Voer deze code in:</p><div id="pair-code" class="pair-code" aria-live="polite">··· ···</div><p id="pair-caption">De code vernieuwt automatisch.</p></div><div id="qr" aria-label="QR-code om de telefoonbediening te openen"></div></section>
  <div id="message" role="status" hidden></div>
  <nav id="toolbar" aria-label="Tv-bediening"><button id="previous" aria-label="Vorig nummer">Vorige</button><button id="toggle">Afspelen</button><button id="next" aria-label="Volgend nummer">Volgende</button><button id="layout">Cinema</button><button id="progress-mode" aria-label="Voortgangsbalk">Balk: altijd</button><button id="waveform-toggle" aria-label="Trackwaveform">Golfvorm: uit</button><button id="pair">Koppelen</button></nav>
  <audio id="audio" preload="auto"></audio>
  <script src="vendor/webOSTV.js"></script><script src="vendor/qrcode.js"></script><script src="waveform.js"></script><script src="tv.js"></script>
</body></html>
